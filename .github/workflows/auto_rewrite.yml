name: Tu Dong Bien Tap Convert Sang Thuan Viet

on:
  push:
    paths:
      - 'input/*.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run AI Rewrite Script
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: node process.js

      - name: Commit and Push output files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff-index --quiet HEAD || (git commit -m "Auto: Da bien tap xong file convert" && git push)
