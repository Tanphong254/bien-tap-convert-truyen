<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biên Tập Viên Convert AI</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 20px auto; padding: 20px; line-height: 1.6; }
        textarea { width: 100%; height: 200px; margin-bottom: 10px; padding: 10px; box-sizing: border-box; }
        button { background-color: #28a745; color: white; padding: 12px 20px; border: none; cursor: pointer; font-size: 16px; border-radius: 5px; }
        button:disabled { background-color: #ccc; }
        .input-group { margin-bottom: 15px; }
        input[type="password"] { width: 100%; padding: 8px; box-sizing: border-box; }
    </style>
</head>
<body>
    <h2>Trợ Lý Biên Tập Convert -> Thuần Việt</h2>
    
    <div class="input-group">
        <label><b>Nhập API Key (DeepSeek / OpenAI):</b></label>
        <input type="password" id="apiKey" placeholder="sk-...">
    </div>

    <div class="input-group">
        <label><b>Bản Convert thô:</b></label>
        <textarea id="inputText" placeholder="Dán văn bản Convert vào đây..."></textarea>
    </div>

    <button id="submitBtn" onclick="processText()">Biến thành bản thuần Việt</button>

    <div class="input-group" style="margin-top: 20px;">
        <label><b>Bản Thuần Việt (Kết quả):</b></label>
        <textarea id="outputText" readonly placeholder="Kết quả sẽ xuất hiện ở đây..."></textarea>
    </div>

    <script>
        async function processText() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const inputText = document.getElementById('inputText').value.trim();
            const outputText = document.getElementById('outputText');
            const btn = document.getElementById('submitBtn');

            if (!apiKey || !inputText) {
                alert('Vui lòng nhập đầy đủ API Key và Văn bản Convert!');
                return;
            }

            btn.disabled = true;
            btn.innerText = 'Đang biên tập...';
            outputText.value = 'AI đang gọt giũa câu chữ, vui lòng chờ...';

            const systemPrompt = `Bạn là một biên tập viên webnovel tiếng Việt kỳ cựu. Nhiệm vụ của bạn là nhận vào đoạn văn bản dịch thô/Convert và viết lại thành văn phong thuần Việt mượt mà, hấp dẫn như một tác giả Việt Nam tự sáng tác.
Quy tắc:
1. Sửa cấu trúc câu Hán Việt cứng nhắc thành tiếng Việt tự nhiên.
2. Giữ nguyên thuật ngữ chuyên dụng thể loại (Linh khí, Trúc cơ, Thái dương...).
3. Tuyệt đối không tóm tắt hay bỏ sót tình tiết.`;

            try {
                const response = await fetch('https://api.deepseek.com/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: 'deepseek-chat',
                        messages: [
                            { role: 'system', content: systemPrompt },
                            { role: 'user', content: inputText }
                        ]
                    })
                });

                const data = await response.json();
                if (data.choices && data.choices[0]) {
                    outputText.value = data.choices[0].message.content;
                } else {
                    outputText.value = 'Lỗi xử lý: ' + JSON.stringify(data);
                }
            } catch (err) {
                outputText.value = 'Lỗi kết nối API: ' + err.message;
            } finally {
                btn.disabled = false;
                btn.innerText = 'Biến thành bản thuần Việt';
            }
        }
    </script>
</body>
</html>
